[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-gains-toolkit"
version = "0.1.0"
description = "Cost basis, wash-sale windows, LTCG bands and the Schedule D capital loss carryover worksheet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["capital-gains", "cost-basis", "wash-sale", "tax", "personal-finance"]

[project.urls]
Homepage = "https://github.com/stockavg/capital-gains-toolkit"

[tool.setuptools]
packages = ["capitalgains"]
